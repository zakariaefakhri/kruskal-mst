[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kruskal-mst"
version = "0.2.0"
description = "Kruskal's minimum spanning tree algorithm with a hand-written union-find and merge sort."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Zakariae Fakhri" }]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/kruskal"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
